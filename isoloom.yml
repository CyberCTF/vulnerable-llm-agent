# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Damn Vulnerable LLM Agent (by WithSecure / ReversecLabs) as an Isoloom spec: the upstream
# Streamlit / LangChain source, vendored unchanged in build/agent/app/, built by its Dockerfile
# with the dependencies pinned by date. The agent's model is a local, deterministic stand-in
# (build/agent/standin/) that answers OpenAI's API inside the machine: no key, no internet.
# To play it on OpenAI's gpt-4o instead, see the README (an optional OPENAI_API_KEY).
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: vulnerable-llm-agent

networks:
  lab: {cidr: 10.60.36.0/24, internet: false}

inputs:
  CTF_FLAG_MAIN: {}

machines:
  agent:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    volumes: {data: /app/data}     # the transactions database, where ctf/flag.sh writes the flag
    ports:
      web:
        port: 8501
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/agent

checks:
  - name: the Streamlit app answers
    http: http://agent:8501/
    wait: 240
  - name: Streamlit reports healthy
    http: http://agent:8501/_stcore/health
  # The full solver (build/agent/check/solve.sh, in the image): upstream's own solutions get
  # userId 2's transactions (the flag), a plain request does not.
  - name: the intended injections solve it
    from: agent
    exec: sh /opt/check/solve.sh
    expect: SOLVED
    wait: 60

message: |
  The bank's support chatbot answers at {{ machines.agent.ports.web.url }}.
  Ask it for your recent transactions, then make it show you another customer's (userId 2).
