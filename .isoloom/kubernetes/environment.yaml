apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-vulnerable-llm-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: agent
  template:
    metadata:
      labels:
        isoloom.com/machine: agent
        net.isoloom.com/lab: member
    spec:
      hostname: agent
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: agent
        image: isoloom/vulnerable-llm-agent-agent
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8501
          periodSeconds: 5
          failureThreshold: 60
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: OPENAI_API_KEY
              optional: true
        resources:
          limits:
            cpu: '1'
            memory: 1024Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
