# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: vulnerable-llm-agent
services:
  agent:
    build:
      context: ../../build/agent
    image: isoloom/vulnerable-llm-agent-agent
    platform: linux/amd64
    hostname: agent
    networks:
      lab:
        ipv4_address: 10.60.36.10
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8501}:8501
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8501
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.web: http:8501
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    networks:
      lab: null
    depends_on:
      agent:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.36.0/24
        gateway: 10.60.36.1
volumes:
  isoloom-probe-amd64: {}
